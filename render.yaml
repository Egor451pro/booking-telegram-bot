services:
  - type: web
    name: booking-tg-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn bot.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: MODE
        value: webhook
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_VERIFY
        value: "true"
      - key: TIMEZONE
        value: Europe/Moscow
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STUDIO_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
